<header class="company-hero">
  <div class="container hero-content">
    <div class="logo-card" [class.initials-mode]="!logoUrl() || logoFailed()">
      @if (logoUrl() && !logoFailed()) {
        <img
          [src]="logoUrl()"
          [alt]="company() + ' logo'"
          class="logo-img"
          referrerpolicy="no-referrer"
          (error)="onLogoError()"
        />
      } @else {
        <div class="initials-avatar" [attr.aria-label]="company()">
          {{ initials() }}
        </div>
      }
    </div>

    <div class="company-meta">
      <h1 class="company-name">{{ company() }}</h1>
      <div class="pills-row">
        <span class="pill country-pill">
          <svg class="pill-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span>{{ country() }}</span>
        </span>
        @if (hasValidLocation()) {
          <span class="pill location-pill">
            <svg class="pill-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
              <circle cx="12" cy="10" r="3"></circle>
            </svg>
            <span>{{ location() }}</span>
          </span>
        }
      </div>
    </div>
  </div>
</header>
