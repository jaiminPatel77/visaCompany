@if (hasVideos()) {
  <section class="profile-card videos-section fade-in" aria-label="Company videos">
    <div class="card-header">
      <div class="accent-bar" aria-hidden="true"></div>
      <h2 class="section-title">Company Videos</h2>
    </div>

    <div class="videos-grid">
      @for (video of videos(); track (video.source + '-' + video.id); let i = $index) {
        <app-video-card [video]="video" [index]="i" />
      }
    </div>
  </section>
}
