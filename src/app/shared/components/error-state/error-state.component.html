<div class="error-container fade-in" role="alert">
  <div class="error-card">
    <div class="error-icon" aria-hidden="true">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
    </div>
    <h2 class="error-title">{{ title() }}</h2>
    <p class="error-message">{{ message() }}</p>
    <button type="button" class="btn-primary retry-btn" (click)="onRetry()">
      Try again
    </button>
  </div>
</div>
