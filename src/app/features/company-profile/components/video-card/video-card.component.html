<div class="video-container">
  @if (!isPlaying()) {
    <div class="poster-wrapper" (click)="play()">
      @if (posterUrl() && !posterFailed()) {
        <img
          [src]="posterUrl()"
          [alt]="videoTitle()"
          class="poster-image"
          loading="lazy"
          decoding="async"
          referrerpolicy="no-referrer"
          (error)="onPosterError()"
        />
      } @else {
        <div class="dark-placeholder">
          <span class="placeholder-text">{{ videoTitle() }}</span>
        </div>
      }

      <div class="poster-overlay">
        <button
          type="button"
          class="play-button"
          [attr.aria-label]="'Play video: ' + videoTitle()"
          (click)="$event.stopPropagation(); play()"
        >
          <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
        </button>
      </div>

      @if (video().name) {
        <div class="video-label">{{ video().name }}</div>
      }
    </div>
  } @else {
    @if (safePlayerUrl()) {
      <iframe
        [src]="safePlayerUrl()"
        class="video-iframe"
        allow="autoplay; encrypted-media; fullscreen"
        allowfullscreen
        referrerpolicy="no-referrer"
        [title]="videoTitle()"
      ></iframe>
    }
  }
</div>
